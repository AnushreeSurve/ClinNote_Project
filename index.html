.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--tx)}
.btn:hover{background:var(--bg)}.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.p:hover{background:var(--navy2)}
.btn.t{background:var(--teal);border-color:var(--teal);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat{padding:12px 14px;border-left:3px solid var(--teal)}.stat b{font-size:24px;display:block;color:var(--navy)}.stat span{color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:7px 12px;border-bottom:1px solid var(--line);background:#fafbfc}

.modal{position:fixed;inset:0;background:rgba(13,36,68,.45);display:grid;place-items:center;z-index:50}
.mb{background:#fff;border-radius:10px;width:480px;max-width:94vw;max-height:90vh;overflow:auto}

.login{height:100%;display:grid;place-items:center;background:var(--bg)}
.lb{width:380px;padding:28px;background:#fff;border:1px solid var(--line);border-radius:10px}

.rep{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;border:1px solid transparent;background:none;padding:5px 8px;border-radius:6px;text-align:left;margin-left:14px;width:calc(100% - 14px)}
.rep:hover{background:var(--bg)}.rep.on{background:var(--tealbg);border-color:var(--teal)}
.seg{display:flex;gap:0}.seg button{border:0;background:none;padding:0 14px;height:40px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}
.seg button.on{color:var(--navy);border-bottom-color:var(--teal)}
.sec{margin-bottom:11px}.sec h4{margin:0 0 3px;font-size:12px;color:var(--teal);font-weight:600}.sec p,.sec li{margin:0}.sec ul{margin:0;padding-left:16px}

  {[['Name','Dr. Anita Rao'],['Doctor ID','DOC-001'],['Department','General Medicine'],['Registration no.','MMC-2011-48213'],['Hospital','City General Hospital, Pune'],['Patients on record',ps.length]].map(([l,v])=><div key={l}><label>{l}</label><div style={{fontWeight:600}}>{v}</div></div>)}</div></div></div>;
}

function Workspace({p,upd,back,say}){
 const firstC=p.reports[0]?.cond;
 const [sel,setSel]=useState(()=>firstC?latestOf(p,firstC).id:null);
 const [open,setOpen]=useState(()=>Object.fromEntries([...new Set(p.reports.map(r=>r.cond))].map(c=>[c,true])));
 const [tab,setTab]=useState('sum');const [viewer,setViewer]=useState(null);const [newC,setNewC]=useState('');
 const rep=p.reports.find(r=>r.id===sel);
 const conds=[...new Set(p.reports.map(r=>r.cond))];
 const addReport=c=>{const id=nid();const prev=latestOf(p,c);upd(x=>({...x,reports:[...x.reports,{id,cond:c,date:new Date().toISOString().slice(0,10),status:'draft',f:blank()}]}));setSel(id);setOpen(o=>({...o,[c]:true}));say('New report started')};
 const addCond=()=>{const c=newC.trim();if(!c)return;if(conds.includes(c)){say('Condition already exists');return}addReport(c);upd(x=>({...x,cond:x.cond||c}));setNewC('')};
 const fileRef=useRef();const [cat,setCat]=useState('Blood report');
 const onFile=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{upd(x=>({...x,docs:[{id:nid(),name:f.name,cat,type:f.type,url:rd.result,date:new Date().toISOString().slice(0,10)},...x.docs]}));say('Report uploaded')};rd.readAsDataURL(f);e.target.value=''};
 return <div className="pg ws">
  <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}><button className="btn" style={{border:0,padding:4,background:'none'}} onClick={back} aria-label="Back to patients"><Ic n="back" s={20}/></button><div><div style={{display:'flex',alignItems:'center',gap:10}}><span className="h2">{p.name}</span><span className="pid">{p.id}</span></div><div className="sub">{p.age} yrs · {p.gender} · Blood group {p.bg} · {p.phone}{p.allergies.length?' · Allergies: '+p.allergies.join(', '):''} · Last visit {fmt(p.last)}</div></div><span style={{flex:1}}/>{p.cond&&<span className="pill">{p.cond}</span>}{p.appt&&<span className="pill o"><Ic n="clock" s={13}/>Today: {p.appt.t}</span>}</div>
  <div className="ws3">
   <div className="card pan"><div className="ch"><div><b>{p.id}</b><div style={{fontWeight:400,color:'var(--mut)',fontSize:12}}>{p.name} · {p.age} y · {p.gender}</div></div></div>
    <div className="pb">
     {!conds.length&&<div className="empty">No conditions recorded. Add the first condition below.</div>}
     {conds.map(c=>{const rs=p.reports.filter(r=>r.cond===c).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);const lat=latestOf(p,c);
      return <div key={c} style={{marginBottom:6}}><div style={{display:'flex',alignItems:'center'}}><button className="cond" onClick={()=>setOpen(o=>({...o,[c]:!o[c]}))}><span style={{display:'inline-block',transform:open[c]?'rotate(90deg)':'none',transition:'transform .15s'}}><Ic n="chev" s={13}/></span>{c}</button>
       <button className="btn" style={{padding:'1px 6px'}} disabled={lat&&lat.status==='draft'} title={lat&&lat.status==='draft'?'Finalise the current report first':'Start a new report'} onClick={()=>addReport(c)}><Ic n="plus" s={12}/></button></div>
       {open[c]&&rs.map(r=>{const ed=isEditable(p,r);return <button key={r.id} className={'rep'+(sel===r.id?' on':'')} onClick={()=>setSel(r.id)}><span>{fmt(r.date)}</span><span className={'tag '+(ed?'e':'ro')}>{ed?'EDITABLE':'READ ONLY'}</span></button>})}</div>})}
     <div style={{display:'flex',gap:4,margin:'6px 0 12px'}}><input className="inp" placeholder="New condition" value={newC} onChange={e=>setNewC(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCond()}/><button className="btn" onClick={addCond}><Ic n="plus"/></button></div>
     <div style={{borderTop:'1px solid var(--line)',paddingTop:8}}><div style={{fontWeight:600,marginBottom:4}}>Medical reports</div>
      {['Blood report','Urine report','Other investigation'].map(k=>{const ds=p.docs.filter(d=>d.cat===k);return <div key={k} style={{marginBottom:5}}><div style={{color:'var(--mut)',fontSize:12}}>{k}s ({ds.length})</div>
       {ds.map(d=><button key={d.id} className="rep" style={{padding:'3px 8px'}} onClick={()=>setViewer(d)}><span style={{display:'flex',gap:5,alignItems:'center',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}><Ic n="file" s={13}/>{d.name}</span><span style={{color:'var(--mut)',fontSize:11}}>{fmt(d.date)}</span></button>)}</div>})}
      <div style={{display:'flex',gap:4,marginTop:6}}><select className="inp" value={cat} onChange={e=>setCat(e.target.value)}><option>Blood report</option><option>Urine report</option><option>Other investigation</option></select></div>
      <input ref={fileRef} type="file" accept="application/pdf,image/*" hidden onChange={onFile}/>
      <button className="btn t" style={{marginTop:6,width:'100%',justifyContent:'center'}} onClick={()=>fileRef.current.click()}><Ic n="up"/>Upload New Report</button></div></div></div>
   <MidPanel p={p} upd={upd} say={say} tab={tab} setTab={setTab} rep={rep} setRepField={null}/>
   <RightPanel key={sel} p={p} rep={rep} upd={upd} say={say} addCondHint={!conds.length}/>
  </div>
  <Chat p={p} upd={upd}/>
  {viewer&&<div className="modal" onMouseDown={e=>e.target===e.currentTarget&&setViewer(null)}><div className="mb" style={{width:760,height:'86vh',display:'flex',flexDirection:'column'}}><div className="ch">{viewer.name}<button className="btn" onClick={()=>setViewer(null)}><Ic n="x"/></button></div>
   <div style={{flex:1,minHeight:0,overflow:'auto',background:'#f6f7f9',display:'grid',placeItems:'center'}}>{viewer.type.startsWith('image')?<img src={viewer.url} style={{maxWidth:'100%'}} alt={viewer.name}/>:<iframe src={viewer.url} title={viewer.name} style={{width:'100%',height:'100%',border:0}}/>}</div>
   <div style={{padding:8,textAlign:'right'}}><a className="btn" href={viewer.url} download={viewer.name}>Download</a></div></div></div>}
 </div>;
}

function MidPanel({p,upd,say,tab,setTab}){
 const [txt,setTxt]=useState(p.transcript||'');const [recOn,setRecOn]=useState(false);const rr=useRef();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 useEffect(()=>()=>{try{rr.current&&rr.current.stop()}catch(e){}},[]);
 const start=()=>{if(!SR){say('Speech recognition unavailable. Type notes manually.');return}
  const r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-IN';
  r.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)s+=e.results[i][0].transcript+'. ';setTxt(t=>(t&&!/\s$/.test(t)?t+' ':t)+s)};
  r.onend=()=>setRecOn(false);r.onerror=()=>{setRecOn(false);say('Microphone not available')};
  rr.current=r;try{r.start();setRecOn(true)}catch(e){}};
 const stop=()=>{try{rr.current&&rr.current.stop()}catch(e){}setRecOn(false)};
 const S=useMemo(()=>summary(p),[p]);
 const Sec=({t,children})=><div className="sec"><h4>{t}</h4>{children}</div>;
 return <div className="card pan"><div className="ch" style={{padding:'0 6px'}}><div className="seg"><button className={tab==='sum'?'on':''} onClick={()=>setTab('sum')}>AI Summary</button><button className={tab==='tr'?'on':''} onClick={()=>setTab('tr')}>Transcript</button></div>
   {tab==='tr'&&(recOn?<span><span className="rec"/> Recording…</span>:<span style={{color:'var(--mut)',fontWeight:400}}>{p.transcript&&p.transcript===txt?'Saved':'Not recording'}</span>)}</div>
  <div className="pb">{tab==='sum'?(!S?<div className="empty">No previous records available. Create a report or record a consultation to generate a summary.</div>:<>
   <div className="note">Combined from {p.reports.filter(nonEmpty).length} report(s). Simulated summary; verify against source records.</div>
   <Sec t="Medical history"><p>{p.hx||'Not recorded.'}</p>{S.conds.length>0&&<p>Conditions: {S.conds.join(', ')}</p>}</Sec>
   <Sec t="Previous diagnoses">{S.dx.length?<ul>{S.dx.map(([d,x],i)=><li key={i}>{x} <span style={{color:'var(--mut)'}}>({fmt(d)})</span></li>)}</ul>:<p>None recorded.</p>}</Sec>
   <Sec t="Medications">{S.meds.length?<ul>{S.meds.map((m,i)=><li key={i}><b>{m[0]}:</b> {m[1]}</li>)}</ul>:<p>None recorded.</p>}</Sec>
   <Sec t="Allergies"><p>{p.allergies.length?p.allergies.join(', '):'No known allergies recorded.'}</p></Sec>
   <Sec t="Important observations">{S.obs.length?<ul>{S.obs.map((o,i)=><li key={i}>{o[1]}{o[2]?' · Follow-up: '+o[2]:''}</li>)}</ul>:<p>None recorded.</p>}</Sec></>)
  :<div style={{display:'flex',flexDirection:'column',height:'100%',gap:8}}>
   <textarea className="inp" style={{flex:1,resize:'none',minHeight:140}} placeholder="Type consultation notes here, or start recording…" value={txt} onChange={e=>setTxt(e.target.value)}/>
   <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><button className="btn r" disabled={recOn} onClick={start}><Ic n="mic"/>Start Recording</button><button className="btn" disabled={!recOn} onClick={stop}>Stop Recording</button>
    <button className="btn p" style={{marginLeft:'auto'}} onClick={()=>{upd(x=>({...x,transcript:txt}));say('Transcript saved')}}>Save Transcript</button></div>
   {!SR&&<div style={{fontSize:11,color:'var(--mut)'}}>Speech recognition is not supported in this browser. Manual typing is available.</div>}</div>}</div></div>;
}

function RightPanel({p,rep,upd,say}){
 const [f,setF]=useState(rep?{...rep.f}:blank());
 const ed=isEditable(p,rep);
 const write=(status)=>{upd(x=>({...x,ts:Date.now(),last:new Date().toISOString().slice(0,10),reports:x.reports.map(r=>r.id===rep.id?{...r,f,status:status||r.status}:r)}))};
 const gen=()=>{const t=(p.transcript||'').trim();if(!t)return say('Save a transcript first');
  const rules={cc:/complain|presents|came with|c\/o/i,hpi:/since|for \d+|days|weeks|onset/i,fi:/exam|bp|pulse|temp|auscult|tender|spo2|findings/i,dx:/diagnos|likely|suggests|impression/i,inv:/test|cbc|ecg|x-ray|scan|hba1c|order/i,rx:/prescrib|tab |mg|start|continue/i,adv:/advise|avoid|rest|diet|exercise/i,fu:/follow|review|return|come back/i};
  const ss=t.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);let n=0;const nf={...f};
  Object.keys(rules).forEach(k=>{if(nf[k].trim())return;const m=ss.filter(s=>rules[k].test(s));if(m.length){nf[k]='[AI draft] '+m.join(' ');n++}});
  setF(nf);say(n?'Draft added to '+n+' empty field(s). Existing text kept.':'No matching content found in transcript')};
 if(!rep)return <div className="card pan"><div className="ch">Current Editable Report</div><div className="pb"><div className="empty">No report selected. Add a condition in the left panel to start a report.</div></div></div>;
 return <div className="card pan"><div className="ch"><span>{ed?'Current Editable Report':'Report (read only)'}</span><span style={{fontWeight:400,fontSize:12,color:'var(--mut)'}}>{rep.cond} · {fmt(rep.date)} <span className={'tag '+(rep.status==='final'?'f':'d')}>{rep.status==='final'?'Finalised':'Draft'}</span></span></div>
  <div className="pb">{FIELDS.map(([k,l])=><div className="fl" key={k}><label>{l}</label><textarea readOnly={!ed} rows={k==='cc'||k==='fu'?1:2} value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})}/></div>)}</div>
  {ed?<div style={{padding:'8px 12px',borderTop:'1px solid var(--line)',display:'flex',gap:6,flexWrap:'wrap'}}><button className="btn t" onClick={gen}>Generate Draft from Transcript</button><span style={{flex:1}}/><button className="btn" onClick={()=>{write();say('Draft saved')}}>Save Draft</button>
   <button className="btn p" onClick={()=>{if(!f.dx.trim())return say('Add a diagnosis before finalising');write('final');say('Report finalised and locked')}}>Finalise Report</button></div>
  :<div className="lock">🔒 This report can’t be edited. Only the latest unfinalised report per condition is editable.</div>}</div>;
}

function Chat({p,upd}){
 const [q,setQ]=useState('');const end=useRef();const msgs=p.chat||[];
 useEffect(()=>{end.current&&end.current.scrollTo(0,end.current.scrollHeight)},[msgs.length]);
 const send=t=>{t=(t??q).trim();if(!t)return;setQ('');upd(x=>({...x,chat:[...(x.chat||[]),{r:'u',t},{r:'b',t:reply(x,t)}]}))};
 return <div className="card chat"><div className="ch">Clinical Assistant<span style={{fontWeight:400,fontSize:12,color:'var(--mut)'}}>Answers only from {p.name}’s recorded data</span></div>
  <div className="msgs" ref={end}>{!msgs.length&&<div className="empty">Ask a question about this patient, or pick a suggestion below.</div>}{msgs.map((m,i)=><div key={i} className={'m '+(m.r==='u'?'u':'b')}>{m.t}</div>)}</div>
  <div style={{padding:'6px 12px 8px',borderTop:'1px solid var(--line)'}}><div style={{display:'flex',gap:6,marginBottom:6,flexWrap:'wrap'}}>{['Summarise patient history.','What medications were prescribed previously?','Are there any recorded allergies?','Compare previous reports.'].map(s=><button key={s} className="chip" onClick={()=>send(s)}>{s}</button>)}</div>
   <div style={{display:'flex',gap:6}}><input className="inp" placeholder="Ask about this patient…" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/><button className="btn p" onClick={()=>send()}><Ic n="send"/>Send</button></div></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
